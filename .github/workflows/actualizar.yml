name: Actualizar y publicar panel del viaje

# Genera index.html (precios de gasolina + tiempo) y lo PUBLICA en GitHub Pages
# directamente (deploy-pages), sin depender de commits ni del PC del usuario.
on:
  schedule:
    - cron: '0 5 * * *'    # ~07:00 hora de Espana (verano)
    - cron: '0 17 * * *'   # ~19:00 hora de Espana (verano)
  push:
    branches: [ main ]
    paths:
      - 'datos.json'
      - 'ViajeAmieva.ps1'
      - '.github/workflows/actualizar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # El servidor del Ministerio usa TLS antiguo que el OpenSSL nuevo de Ubuntu
      # rechaza; esta config lo permite solo para descargar los precios.
      - name: Permitir TLS heredado (API Ministerio)
        run: |
          cat > "$HOME/openssl-legacy.cnf" <<'EOF'
          openssl_conf = openssl_init
          [openssl_init]
          ssl_conf = ssl_sect
          [ssl_sect]
          system_default = system_default_sect
          [system_default_sect]
          Options = UnsafeLegacyRenegotiation
          CipherString = DEFAULT@SECLEVEL=0
          MinProtocol = TLSv1
          EOF

      - name: Generar index.html (precios + tiempo)
        shell: pwsh
        env:
          OPENSSL_CONF: /home/runner/openssl-legacy.cnf
        run: ./ViajeAmieva.ps1 -NoOpen

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en Pages
        id: deploy
        uses: actions/deploy-pages@v4
