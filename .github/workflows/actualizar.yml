name: Actualizar panel del viaje

# Reconstruye index.html (precios de gasolina + tiempo) en la nube, sin depender del PC.
on:
  schedule:
    - cron: '0 5 * * *'    # ~07:00 hora de Espana (verano)
    - cron: '0 17 * * *'   # ~19:00 hora de Espana (verano)
  push:
    branches: [ main ]
    paths:
      - 'datos.json'
      - 'ViajeAmieva.ps1'
      - '.github/workflows/actualizar.yml'
  workflow_dispatch:        # boton para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-panel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # El servidor del Ministerio usa TLS antiguo que el OpenSSL nuevo de Ubuntu
      # rechaza por defecto. Esta config permite la renegociacion/cifrados heredados
      # solo para descargar los precios.
      - name: Permitir TLS heredado (API Ministerio)
        run: |
          cat > "$HOME/openssl-legacy.cnf" <<'EOF'
          openssl_conf = openssl_init
          [openssl_init]
          ssl_conf = ssl_sect
          [ssl_sect]
          system_default = system_default_sect
          [system_default_sect]
          Options = UnsafeLegacyRenegotiation
          CipherString = DEFAULT@SECLEVEL=0
          MinProtocol = TLSv1
          EOF

      - name: Generar index.html (precios + tiempo)
        shell: pwsh
        env:
          OPENSSL_CONF: /home/runner/openssl-legacy.cnf
        run: ./ViajeAmieva.ps1 -NoOpen

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sin cambios en index.html."
          else
            git commit -m "Actualiza precios y tiempo (automatico)"
            git push
          fi
